server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and WebSocket traffic go to the backend service (see docker-compose.yml).
    # This means the built frontend never needs VITE_API_BASE_URL set — it
    # calls same-origin /api/* and nginx does the forwarding, exactly like
    # the Vite dev proxy does in local development.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback: any non-file, non-API route serves index.html so
    # react-router's client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
